name: Backend (API, Lambda and DynamoDB)

on:
  push:
    branches:
      - main
    paths:
      - "lambda-function/**"
      - "terraform/**"
      - "requirements.txt"
      - ".github/workflows/backend-cicd.yml"
  pull_request:
    paths:
      - "lambda-function/**"
      - "terraform/**"
      - "requirements.txt"
      - ".github/workflows/backend-cicd.yml"

permissions:
  contents: read

jobs:
  test:
    name: unittest-backend
    runs-on: ubuntu-latest
    # No AWS credentials in this job: the tests must never reach real AWS.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Same as the Lambda runtime

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s lambda-function -v

  terraform-check:
    name: terraform-fmt-validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform init -backend=false
          terraform validate

  deploy:
    name: aws-deployment
    runs-on: ubuntu-latest
    needs: [test, terraform-check]
    # Deploy only from main, never from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      TERRAFORM_BACKEND_BUCKET: ${{ secrets.TERRAFORM_BACKEND_BUCKET }}
      TERRAFORM_BACKEND_KEY: global/s3/terraform.tfstate
      TERRAFORM_BACKEND_DYNAMODB_TABLE: ${{ secrets.TERRAFORM_BACKEND_DYNAMODB_TABLE }}
      TERRAFORM_BACKEND_REGION: us-west-2

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # To drop the long-lived keys, switch to GitHub OIDC: replace the two
      # key inputs with role-to-assume and add "id-token: write" permission.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Create backend.tf
        run: |
          cat > backend.tf <<TF
          terraform {
            backend "s3" {
              bucket         = "$TERRAFORM_BACKEND_BUCKET"
              key            = "$TERRAFORM_BACKEND_KEY"
              dynamodb_table = "$TERRAFORM_BACKEND_DYNAMODB_TABLE"
              region         = "$TERRAFORM_BACKEND_REGION"
              encrypt        = true
            }
          }
          TF

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
