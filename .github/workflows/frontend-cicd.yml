name: Frontend (Upload Website to S3 Bucket)

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/frontend-cicd.yml"

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token for AWS

jobs:
  deploy:
    name: upload-website-files
    runs-on: ubuntu-latest

    env:
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      # CloudFront caches the site (Managed-CachingOptimized), so every deploy
      # must invalidate it. The distribution ID is not a secret; the secret, if
      # set, still takes precedence.
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID || 'E1MGI1EPH0TGKV' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Short-lived credentials via GitHub OIDC; no stored AWS keys. The role
      # can only sync the site bucket and invalidate CloudFront.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::287053549850:role/github-actions-resume-frontend
          role-session-name: frontend-deploy-${{ github.run_id }}
          aws-region: us-west-2

      # Cache-Control: CloudFront keeps everything for a day (s-maxage) and is
      # invalidated on deploy. Browsers revalidate pages on every visit and keep
      # CSS/JS/images for an hour, so updates show up quickly for returning visitors.
      - name: Sync website to S3
        run: |
          aws s3 sync website "s3://$AWS_S3_BUCKET" --delete \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" \
            --cache-control "public, max-age=3600, s-maxage=86400"
          aws s3 sync website "s3://$AWS_S3_BUCKET" --delete \
            --exclude "*" --include "*.html" --include "*.xml" --include "*.txt" \
            --cache-control "public, max-age=0, must-revalidate, s-maxage=86400"

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
